<svg width="600" height="540" viewBox="0 0 600 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lapAlum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cdcdd1"/>
      <stop offset="50%" stop-color="#a8a8ac"/>
      <stop offset="100%" stop-color="#7a7a7d"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a4a25"/>
      <stop offset="100%" stop-color="#5a3a1f"/>
    </linearGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="300" cy="500" rx="220" ry="10" fill="#000" opacity="0.18"/>

  <!-- Steam -->
  <g fill="#d8d8dc" opacity="0.6">
    <ellipse cx="290" cy="80" rx="18" ry="10"/>
    <ellipse cx="310" cy="55" rx="22" ry="12"/>
    <ellipse cx="335" cy="80" rx="16" ry="9"/>
    <ellipse cx="275" cy="100" rx="14" ry="8"/>
  </g>

  <!-- Coffee mug -->
  <ellipse cx="305" cy="135" rx="35" ry="6" fill="#5a3a1f"/>
  <path d="M 270 135 L 273 200 Q 274 210 282 212 L 328 212 Q 336 210 337 200 L 340 135 Z"
        fill="#fff" stroke="#bbb" stroke-width="1"/>
  <ellipse cx="305" cy="135" rx="32" ry="5" fill="#3a2010"/>
  <!-- Mug handle -->
  <path d="M 340 150 Q 358 155 358 175 Q 358 195 340 200" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <path d="M 340 150 Q 358 155 358 175 Q 358 195 340 200" fill="none" stroke="#bbb" stroke-width="1"/>
  <!-- Apple logo on mug -->
  <g transform="translate(297, 162)" fill="#888" opacity="0.5">
    <path d="M 6 3 C 4 3 3 2 3 2 C 1 2 0 4 0 7 C 0 10 2 13 4 13 C 5 13 6 12 6 12 C 7 12 7 13 8 13 C 11 13 13 10 13 7 C 13 4 11 2 9 2 C 8 2 7 3 6 3 Z"/>
  </g>

  <!-- Leather sleeve (visible underneath the laptop, slightly larger) -->
  <rect x="100" y="280" width="400" height="100" rx="14" fill="url(#leather)"/>
  <rect x="100" y="280" width="400" height="6" rx="3" fill="#8a5a35" opacity="0.7"/>
  <rect x="100" y="376" width="400" height="6" rx="3" fill="#3a2010" opacity="0.7"/>
  <!-- Stitching detail on the sleeve -->
  <line x1="115" y1="295" x2="485" y2="295" stroke="#3a2010" stroke-width="0.6" stroke-dasharray="3 3" opacity="0.6"/>
  <line x1="115" y1="365" x2="485" y2="365" stroke="#3a2010" stroke-width="0.6" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- MacBook Pro (closed) sitting on the sleeve -->
  <rect x="120" y="220" width="360" height="68" rx="6" fill="url(#lapAlum)"/>
  <!-- Top edge highlight -->
  <rect x="120" y="220" width="360" height="2" rx="1" fill="#dcdcdf"/>
  <!-- Bottom shadow under closed lid (subtle line indicating clamshell join) -->
  <rect x="120" y="282" width="360" height="2" fill="#7a7a7d"/>
  <!-- Apple logo on the lid -->
  <g transform="translate(290, 244)" fill="#7a7a7d" opacity="0.55">
    <path d="M 11 5
             C 9 5 7 4 6 4
             C 3 4 1 6 1 11
             C 1 16 4 22 7 22
             C 8 22 9 21 10 21
             C 11 21 12 22 13 22
             C 16 22 19 16 19 11
             C 19 6 17 4 15 4
             C 14 4 13 5 11 5 Z"/>
    <path d="M 12 1 C 12 -1 13 -2 16 -2 C 16 0 14 1 12 1 Z"/>
  </g>

  <!-- Heat shimmer rising from laptop top -->
  <g opacity="0.4" stroke="#ff7a3a" stroke-width="1.4" fill="none" stroke-linecap="round">
    <path d="M 165 220 Q 168 215 165 210 Q 162 205 165 200"/>
    <path d="M 200 220 Q 203 215 200 210 Q 197 205 200 200"/>
    <path d="M 405 220 Q 408 215 405 210 Q 402 205 405 200"/>
    <path d="M 440 220 Q 443 215 440 210 Q 437 205 440 200"/>
  </g>
</svg>
