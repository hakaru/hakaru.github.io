<svg width="600" height="540" viewBox="0 0 600 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="alum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a8a8ac"/>
      <stop offset="50%" stop-color="#d8d8dc"/>
      <stop offset="100%" stop-color="#a0a0a4"/>
    </linearGradient>
    <radialGradient id="ember" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#ff3d00" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7a1a00" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lattice" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="6" fill="#1d1d1f" opacity="0.7"/>
    </pattern>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="300" cy="510" rx="160" ry="10" fill="#000" opacity="0.18"/>

  <!-- Smoke clouds rising from top -->
  <g fill="#d8d8dc" opacity="0.7">
    <ellipse cx="240" cy="80" rx="36" ry="22"/>
    <ellipse cx="290" cy="50" rx="44" ry="26"/>
    <ellipse cx="345" cy="78" rx="38" ry="22"/>
    <ellipse cx="220" cy="120" rx="30" ry="18"/>
    <ellipse cx="380" cy="125" rx="32" ry="19"/>
    <ellipse cx="305" cy="140" rx="28" ry="16"/>
  </g>

  <!-- Mac Pro tower body -->
  <!-- Top cap with handles -->
  <rect x="220" y="160" width="160" height="14" rx="4" fill="url(#alum)"/>
  <!-- Handles (small loops at top corners) -->
  <ellipse cx="225" cy="155" rx="6" ry="10" fill="none" stroke="#7a7a7d" stroke-width="3"/>
  <ellipse cx="375" cy="155" rx="6" ry="10" fill="none" stroke="#7a7a7d" stroke-width="3"/>

  <!-- Main lattice section -->
  <rect x="220" y="174" width="160" height="240" fill="url(#alum)"/>
  <rect x="226" y="180" width="148" height="228" fill="url(#lattice)"/>

  <!-- Smoke wisps coming through the lattice -->
  <g fill="#fff" opacity="0.55">
    <ellipse cx="245" cy="220" rx="12" ry="6"/>
    <ellipse cx="280" cy="200" rx="14" ry="7"/>
    <ellipse cx="315" cy="215" rx="13" ry="6"/>
    <ellipse cx="350" cy="195" rx="11" ry="6"/>
    <ellipse cx="265" cy="260" rx="10" ry="5"/>
    <ellipse cx="335" cy="255" rx="11" ry="5"/>
  </g>

  <!-- Bottom solid section -->
  <rect x="220" y="414" width="160" height="32" fill="url(#alum)"/>
  <!-- Wood-chip drawer (slightly pulled out) -->
  <rect x="218" y="446" width="164" height="36" rx="3" fill="#5a3a1f"/>
  <rect x="218" y="446" width="164" height="6" fill="#7a4a25"/>
  <!-- Wood chips visible -->
  <g fill="#3a2010">
    <rect x="232" y="458" width="14" height="10" rx="1"/>
    <rect x="252" y="461" width="16" height="9" rx="1"/>
    <rect x="274" y="457" width="13" height="11" rx="1"/>
    <rect x="294" y="460" width="18" height="9" rx="1"/>
    <rect x="318" y="458" width="14" height="10" rx="1"/>
    <rect x="338" y="462" width="15" height="8" rx="1"/>
    <rect x="358" y="458" width="14" height="10" rx="1"/>
  </g>
  <!-- Drawer pull -->
  <rect x="295" y="475" width="10" height="4" rx="2" fill="#3a2010"/>
  <!-- Glowing ember spots on chips -->
  <ellipse cx="245" cy="465" rx="9" ry="5" fill="url(#ember)"/>
  <ellipse cx="305" cy="465" rx="11" ry="5" fill="url(#ember)"/>
  <ellipse cx="355" cy="465" rx="8" ry="4" fill="url(#ember)"/>

  <!-- Bottom plinth -->
  <rect x="218" y="482" width="164" height="14" rx="2" fill="#7a7a7d"/>

  <!-- Faint engraved label on the side panel -->
  <text x="300" y="395" text-anchor="middle" font-size="10" font-family="-apple-system" fill="#6a6a6c" letter-spacing="1.5">SMOKER EDITION</text>

  <!-- Apple logo style mark mid-tower -->
  <g transform="translate(290, 285)" fill="#5a5a5d" opacity="0.8">
    <path d="M 10 4 C 7 4 6 3 5 3 C 2 3 0 5 0 9 C 0 13 3 18 6 18 C 7 18 8 17 9 17 C 10 17 11 18 12 18 C 15 18 18 13 18 9 C 18 5 16 3 13 3 C 12 3 11 4 10 4 Z"/>
    <path d="M 11 1 C 11 -1 12 -2 14 -2 C 14 0 13 1 11 1 Z"/>
  </g>
</svg>
