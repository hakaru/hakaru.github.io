<svg width="600" height="540" viewBox="0 0 600 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="teeNatural" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0e8d8"/>
      <stop offset="50%" stop-color="#e2d8c2"/>
      <stop offset="100%" stop-color="#c8bca0"/>
    </linearGradient>
    <radialGradient id="teeShade2" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.18"/>
    </radialGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="300" cy="500" rx="180" ry="10" fill="#000" opacity="0.18"/>

  <!-- T-shirt silhouette -->
  <path d="M 220 130
           L 175 145
           L 110 200
           L 130 240
           L 165 220
           L 165 470
           Q 165 480 175 480
           L 425 480
           Q 435 480 435 470
           L 435 220
           L 470 240
           L 490 200
           L 425 145
           L 380 130
           Q 380 175 300 175
           Q 220 175 220 130 Z"
        fill="url(#teeNatural)" stroke="#9a8c70" stroke-width="1.2"/>

  <!-- Subtle vignette -->
  <ellipse cx="300" cy="290" rx="170" ry="120" fill="url(#teeShade2)"/>

  <!-- Crew neck rib -->
  <path d="M 220 130 Q 300 178 380 130" fill="none" stroke="#9a8c70" stroke-width="2"/>
  <path d="M 222 134 Q 300 174 378 134" fill="none" stroke="#bfb098" stroke-width="0.8"/>

  <!-- Sleeve seams -->
  <path d="M 165 220 Q 178 215 195 218" fill="none" stroke="#9a8c70" stroke-width="0.8" opacity="0.5"/>
  <path d="M 435 220 Q 422 215 405 218" fill="none" stroke="#9a8c70" stroke-width="0.8" opacity="0.5"/>

  <!-- Hem stitching -->
  <line x1="170" y1="468" x2="430" y2="468" stroke="#9a8c70" stroke-width="0.6" stroke-dasharray="3 2" opacity="0.5"/>

  <!-- Cooking Plate illustration printed on chest, in dark ink screen-print look -->
  <g transform="translate(300, 320)" fill="#2a2520" stroke="#2a2520" stroke-linejoin="round">
    <!-- Steam wisps -->
    <g stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.75">
      <path d="M -28 -90 Q -24 -100 -28 -110 Q -32 -120 -28 -130"/>
      <path d="M 0 -94 Q 4 -104 0 -114 Q -4 -124 0 -134"/>
      <path d="M 28 -90 Q 32 -100 28 -110 Q 32 -120 28 -130"/>
    </g>

    <!-- Dutch oven sitting on the plate -->
    <!-- Lid knob -->
    <ellipse cx="0" cy="-72" rx="6" ry="2.4" stroke-width="0"/>
    <rect x="-2.4" y="-75" width="4.8" height="3.6" rx="1" stroke-width="0"/>
    <!-- Lid -->
    <ellipse cx="0" cy="-62" rx="44" ry="6" stroke-width="0"/>
    <path d="M -44 -62 Q -44 -68 0 -68 Q 44 -68 44 -62 Z" stroke-width="0"/>
    <!-- Pot body -->
    <path d="M -48 -56
             L 48 -56
             L 46 -10
             Q 44 -2 32 -1
             L -32 -1
             Q -44 -2 -46 -10 Z"
          stroke-width="0"/>
    <!-- Side ear handles -->
    <path d="M -48 -48 L -56 -45 L -56 -36 L -48 -38 Z" stroke-width="0"/>
    <path d="M 48 -48 L 56 -45 L 56 -36 L 48 -38 Z" stroke-width="0"/>

    <!-- Cooking plate (round disc) -->
    <ellipse cx="0" cy="2" rx="92" ry="14" stroke-width="0"/>
    <ellipse cx="0" cy="2" rx="92" ry="14" fill="none" stroke-width="2"/>

    <!-- Faint wordmark on the plate edge -->
    <text x="0" y="6" text-anchor="middle" font-size="6" font-family="-apple-system, SF Pro" fill="#f0e8d8" letter-spacing="1.2">MacSlowCooker</text>

    <!-- Mac Studio body underneath -->
    <rect x="-58" y="14" width="116" height="36" rx="3" stroke-width="0"/>
    <!-- Front ports -->
    <circle cx="-30" cy="32" r="2" fill="#f0e8d8" stroke-width="0"/>
    <rect x="-18" y="30" width="10" height="3" fill="#f0e8d8" stroke-width="0"/>
    <rect x="6" y="30" width="10" height="3" fill="#f0e8d8" stroke-width="0"/>
    <circle cx="28" cy="32" r="2" fill="#f0e8d8" stroke-width="0"/>

    <!-- Flame peeking from between plate and Mac Studio -->
    <path d="M -8 14 Q -10 8 -6 4 Q -4 8 0 4 Q 2 9 6 4 Q 10 8 8 14 Z"
          fill="#f0e8d8" stroke-width="0" opacity="0.6"/>
  </g>

  <!-- Tiny wordmark below illustration -->
  <text x="300" y="425" text-anchor="middle" font-size="9" font-family="-apple-system, SF Pro" font-weight="500" fill="#2a2520" letter-spacing="2">COOKING PLATE · EST. 2026</text>
</svg>
